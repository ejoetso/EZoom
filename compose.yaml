services:
  ezoom:
    build:
      context: .
    container_name: ezoom
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?Set SUPERADMIN_EMAIL in your private .env file}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?Set SUPERADMIN_PASSWORD in your private .env file}
      TRIAL_EMAIL: ${TRIAL_EMAIL:-user@ejoecast.com}
      TRIAL_PASSWORD: ${TRIAL_PASSWORD:-user123!}
      TRIAL_DURATION_MINUTES: ${TRIAL_DURATION_MINUTES:-30}
      LICENSE_DATA_DIR: /app/data
